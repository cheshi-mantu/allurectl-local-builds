name: matrix to local instance

on:
  workflow_dispatch:
    inputs:
      TESTS_TYPE:
        description: "Select type of tests"
        required: true
        type: choice
        options:
          - tests/poco
          - tests/attachments
          - tests
        default: tests/poco
      TESTS_SUCCESS:
        description: "Decide if tests would fail or not"
        required: true
        type: choice
        options:
          - random
          - always
          - broken
          - never
        default: always
      ALLURE_JOB_RUN_ID:
        description: "ALLURE_JOB_RUN_ID service parameter. Leave blank."
        required: false
      ALLURE_USERNAME:
        description: "ALLURE_USERNAME service parameter. Leave blank"
        required: false
env:
  ALLURE_RESULTS: "allure-results"
  ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}

jobs:
  matrix-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        THREADS: [ONE, TWO]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest allure-pytest 
      - uses: actions/github-script@v4
        id: allure-job-uid
        with:
          result-encoding: string
          script: |
            const result = await github.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            return `${context.repo.owner}/${context.repo.repo}/actions/workflows/${result.data.workflow_id}`
      - name: install and configure allurectl
        uses: allure-framework/setup-allurectl@v1.0.3
        with:
          allure-endpoint: ${{ secrets.ALLURE_ENDPOINT_LOCAL }}
          allure-token: ${{ secrets.ALLURE_TOKEN_LOCAL }}
          allure-project-id: 22
      - name: This is SPARTAAAAAA
        continue-on-error: true
        run: |
          if [ "${{ matrix.THREADS }}" != "ONE" ]; then
            sleep 2
          fi
          allurectl watch -- pytest ${{ inputs.TESTS_TYPE }}
        env:
          TESTS_SUCCESS: "${{ inputs.TESTS_SUCCESS }}"
          ALLURE_RESULTS: "allure-results"
          ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
          THREADS: ${{ matrix.THREADS }}
          ALLURE_LAUNCH_TAGS: "${{ inputs.TESTS_TYPE }}"
          ALLURE_JOB_UID: ${{ steps.allure-job-uid.outputs.result }}
          